; Loaded after Ubuntu's www.conf, these values win. Its default is 5 workers.
[www]
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
; Same as nginx's fastcgi_read_timeout: past it nobody waits for the answer.
request_terminate_timeout = 60s
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2
