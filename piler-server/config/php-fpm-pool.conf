; Loaded after www.conf: php-fpm reopens the [www] pool and these values win.
; The Ubuntu defaults allow 5 workers and no time limit, so a few slow
; requests made every other request of the web UI wait in the queue.
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; A stuck request frees its worker instead of holding it until restart.
; Long enough for a large export or download.
request_terminate_timeout = 300s
; Writes the PHP backtrace of any request slower than this to the container log.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
