# Logs and PHP get the client address that Traefik saw, not Traefik's own.
# Safe to trust any source: the module publishes port 80 on 127.0.0.1 only,
# so every request reaches nginx through Traefik.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Forwarded-For;
# Off on purpose: nginx takes the last address, the one Traefik appended.
# The addresses before it come from the client and can be forged.
real_ip_recursive off;
