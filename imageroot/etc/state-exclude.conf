#
# piler state/backup exclude patterns for Restic
# https://restic.readthedocs.io/en/stable/040_backup.html#excluding-files
#
# FREEZE does not cover the binlog, so a copy of it can be torn.
# Without it, a restore loses only the writes made during the backup.
volumes/manticore-data/binlog.*
volumes/manticore-data/*.lock
volumes/manticore-data/manticore.pid
