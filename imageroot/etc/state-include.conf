#
# piler state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
#
# volumes/piler_spool is deliberately absent: it holds mail accepted over SMTP
# and not yet archived. Restoring it would replay mail into a database snapshot
# that knows nothing about it. It is a volume so a container recreation does not
# drop that mail, not because it is worth keeping.
#
# volumes/piler_etc must stay: it holds piler.key, which the archived mail in
# volumes/piler_store is encrypted with. A store restored without its key cannot
# be decrypted.
#
state/piler.sql
state/sync2pilerdone
state/templates
volumes/manticore-data
volumes/piler_store
volumes/piler_etc
