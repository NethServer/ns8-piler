name: build-piler-server

on:
  workflow_call:
    outputs:
      image:
        description: "image:tag pushed for this run"
        value: ${{ jobs.build-and-push.outputs.image }}
  workflow_dispatch: {}

concurrency:
  group: build-piler-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
        run: |
          REPOBASE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="${REPOBASE}/piler-server"

          # The module's IMAGETAG, so its org.nethserver.images label names this push.
          tag=$(echo "${REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')
          tags=("${image}:${tag}")
          if [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            tags+=("${image}:latest")
          fi

          args=()
          for t in "${tags[@]}"; do args+=(--tag "${t}"); done

          docker buildx build --file piler-server/Dockerfile \
            --label "org.opencontainers.image.revision=${SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${args[@]}" \
            --push piler-server
          echo "image=${image}:${tag}" >> "$GITHUB_OUTPUT"
