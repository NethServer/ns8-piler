name: build-piler-server

on:
  workflow_call:
    outputs:
      image:
        description: "image:tag pushed for this run"
        value: ${{ jobs.build-and-push.outputs.image }}
  workflow_dispatch: {}

concurrency:
  group: build-piler-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
        run: |
          REPOBASE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="${REPOBASE}/piler-server"

          # Same primary tag publish-branch.yml gives the module image (literal
          # ref name), so build-images.sh's org.nethserver.images label can
          # reference ${IMAGETAG} and always find a real, just-pushed image.
          tag=$(echo "${REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')
          short_sha="${SHA:0:7}"
          sha_tag="${tag}-${short_sha}"

          # sha_tag: what validate-piler-server.yml pins to, immune to later pushes.
          tags=("${image}:${tag}" "${image}:${sha_tag}")
          if [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            tags+=("${image}:latest")
          fi

          args=()
          for t in "${tags[@]}"; do args+=(--tag "${t}"); done

          docker buildx build --file piler-server/Dockerfile \
            --label "org.opencontainers.image.revision=${SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${args[@]}" \
            --push piler-server
          echo "image=${image}:${sha_tag}" >> "$GITHUB_OUTPUT"

          {
            echo "### piler-server image"
            echo '```'
            printf '%s\n' "${tags[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
