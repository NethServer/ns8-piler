name: build-piler-server

on:
  workflow_call:
    outputs:
      image:
        description: "image:tag pushed for this run"
        value: ${{ jobs.build-and-push.outputs.image }}
      piler_server_tag:
        description: "the <piler version>-<ubuntu date> tag, derived from piler-server/Dockerfile"
        value: ${{ jobs.build-and-push.outputs.piler_server_tag }}
  workflow_dispatch: {}

concurrency:
  group: build-piler-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
      piler_server_tag: ${{ steps.vars.outputs.piler_server_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the piler-server tag
        id: vars
        working-directory: piler-server
        run: |
          . ./dockerfile-vars.sh
          : "${piler_server_tag:?cannot derive the piler-server tag from piler-server/Dockerfile}"
          echo "piler_server_tag=${piler_server_tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
          PILER_SERVER_TAG: ${{ steps.vars.outputs.piler_server_tag }}
        run: |
          REPOBASE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="${REPOBASE}/piler-server"

          tag=$(echo "${REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')

          tags=("${image}:${tag}")
          # Only push the derived version tag from main or from a git tag ref -
          # a feature-branch build must never overwrite the tag that installed
          # clusters pull.
          if [ "${REF_NAME}" = "${DEFAULT_BRANCH}" ] || [ "${REF_TYPE}" = "tag" ]; then
            tags+=("${image}:${PILER_SERVER_TAG}")
          fi

          args=()
          for t in "${tags[@]}"; do args+=(--tag "${t}"); done

          docker buildx build --file piler-server/Dockerfile \
            --label "org.opencontainers.image.revision=${SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${args[@]}" \
            --push piler-server
          echo "image=${image}:${tag}" >> "$GITHUB_OUTPUT"

          {
            echo "### piler-server image"
            echo '```'
            printf '%s\n' "${tags[@]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
