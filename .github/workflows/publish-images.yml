name: "Publish images"

on:
  push:
  workflow_dispatch:

permissions:
  packages: write
  actions: read
  contents: write
  security-events: write

jobs:
  piler-server:
    uses: ./.github/workflows/build-piler-server.yml
  publish-images:
    needs: piler-server
    if: github.run_number > 1
    uses: NethServer/ns8-github-actions/.github/workflows/publish-branch.yml@v1
  module:
    needs: publish-images
    uses: NethServer/ns8-github-actions/.github/workflows/module-info.yml@v1
  trivy:
    needs: module
    if: ${{ needs.module.outputs.release == 'stable' || needs.module.outputs.release == 'latest' || github.event_name == 'workflow_dispatch' }}
    uses: NethServer/ns8-github-actions/.github/workflows/scan-with-trivy.yml@v1
    with:
      images: ${{ needs.module.outputs.images }}
  summary:
    # publish-branch.yml (the job that actually builds and pushes the module
    # image) is an external reusable workflow with no step summary of its
    # own - only a ::notice buried in its logs. module-info.yml already
    # resolved the pushed image afterward, so surface it here instead.
    needs: module
    runs-on: ubuntu-26.04
    steps:
      - name: Module images
        env:
          IMAGE: ${{ needs.module.outputs.image }}
          IMAGES: ${{ needs.module.outputs.images }}
        run: |
          {
            echo "### piler module image"
            echo '```'
            echo "${IMAGE}"
            echo '```'
            echo "### org.nethserver.images (module + piler-server + sidecars)"
            echo '```'
            echo "${IMAGES}" | jq -r '.[]'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
