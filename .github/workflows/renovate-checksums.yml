name: renovate-checksums

# Renovate can bump ARG PILER_VERSION and ARG SUPERCRONIC_VERSION (it has a
# customManager for both in renovate.json) but has no way to compute the
# paired ARG *_SHA256 the Dockerfile verifies at build time - a bare version
# bump lands a PR that fails on `sha256sum -c -`. This resolves and commits
# the correct digests onto the Renovate branch so the PR goes green on its
# own.
#
# Renovate's branches live in this repo, not a fork (branchPrefix: renovate-
# in renovate.json), so a plain pull_request trigger is safe here - there is
# no need for pull_request_target's elevated-permissions-on-untrusted-code
# risk.
on:
  pull_request:
    branches: [main]
    paths:
      - piler-server/Dockerfile

permissions:
  contents: read

jobs:
  fill-checksums:
    if: startsWith(github.head_ref, 'renovate-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          # A push made with the default GITHUB_TOKEN does not trigger further
          # workflow runs, so the PR's checks would stay on the stale commit.
          # RENOVATE_PUSH_TOKEN is a fine-grained PAT with contents:write on
          # this repo - same pattern as IMAGES_CLEANUP_TOKEN in
          # clean-registry.yml.
          token: ${{ secrets.RENOVATE_PUSH_TOKEN }}

      - name: Resolve the checksums this version bump needs
        id: resolve
        working-directory: piler-server
        run: |
          set -e

          piler_version=$(grep -oP -m1 '^ARG PILER_VERSION=\K.*' Dockerfile)
          supercronic_version=$(grep -oP -m1 '^ARG SUPERCRONIC_VERSION=\K.*' Dockerfile)
          current_piler_sha=$(grep -oP -m1 '^ARG PILER_SHA256=\K.*' Dockerfile)
          current_supercronic_sha=$(grep -oP -m1 '^ARG SUPERCRONIC_SHA256=\K.*' Dockerfile)

          # Same asset-resolution logic as the Dockerfile itself: the .deb
          # filename embeds an upstream build hash, so the URL is looked up
          # from the release rather than guessed.
          piler_url=$(curl -fsSL "https://api.github.com/repos/jsuto/piler/releases/tags/piler-${piler_version}" \
            | grep -o 'https://github.com/jsuto/piler/releases/download/[^"]*_amd64\.deb' \
            | head -n1)
          : "${piler_url:?no amd64 .deb asset found for piler-${piler_version}}"
          curl -fsSLo /tmp/piler.deb "${piler_url}"
          piler_sha=$(sha256sum /tmp/piler.deb | cut -d' ' -f1)

          curl -fsSLo /tmp/supercronic \
            "https://github.com/aptible/supercronic/releases/download/${supercronic_version}/supercronic-linux-amd64"
          supercronic_sha=$(sha256sum /tmp/supercronic | cut -d' ' -f1)

          changed=0
          if [ "${piler_sha}" != "${current_piler_sha}" ]; then
            sed -i "s/^ARG PILER_SHA256=.*/ARG PILER_SHA256=${piler_sha}/" Dockerfile
            changed=1
          fi
          if [ "${supercronic_sha}" != "${current_supercronic_sha}" ]; then
            sed -i "s/^ARG SUPERCRONIC_SHA256=.*/ARG SUPERCRONIC_SHA256=${supercronic_sha}/" Dockerfile
            changed=1
          fi
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      - name: Commit the resolved checksums onto the Renovate branch
        if: steps.resolve.outputs.changed == '1'
        working-directory: piler-server
        run: |
          git config user.name "renovate-checksums[bot]"
          git config user.email "actions@github.com"
          git add Dockerfile
          git commit -m "chore(deps): resolve the checksum for this version bump"
          git push origin "HEAD:${{ github.head_ref }}"
