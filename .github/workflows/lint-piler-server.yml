name: lint-piler-server

# Needs no registry credentials and no build, so it runs on fork PRs too.
on:
  push:
    branches: [main]
    paths:
      - piler-server/**
      - .github/workflows/lint-piler-server.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - piler-server/**
      - .github/workflows/lint-piler-server.yml
  workflow_dispatch: {}

concurrency:
  group: lint-piler-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: shellcheck
        working-directory: piler-server
        run: |
          docker run --rm -v "${PWD}:/mnt" -w /mnt koalaman/shellcheck:stable \
            --severity=warning \
            entrypoint.sh \
            build-images.sh \
            dockerfile-vars.sh \
            config/piler-run.sh \
            tests/entrypoint-config-test.sh

  hadolint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: hadolint
        working-directory: piler-server
        run: |
          docker run --rm -i -v "${PWD}/.hadolint.yaml:/.hadolint.yaml" \
            hadolint/hadolint hadolint --no-color - < Dockerfile

  entrypoint-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The PHP assertions are the point of this job.
      - name: Check php is available
        run: php --version

      - name: Config generation tests
        working-directory: piler-server
        run: tests/entrypoint-config-test.sh
